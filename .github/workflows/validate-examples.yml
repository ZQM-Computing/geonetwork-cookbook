name: Validate examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find examples -type f -name '*.sh' -print0)
      - name: Parse JSON fixtures
        run: python3 -m json.tool examples/02-harvest/harvester.json > /dev/null
      - name: Run fixture and HTTP safety contracts
        run: python3 -m unittest discover -s tests -v
      - name: Parse XML fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          fixtures = sorted(Path("examples").rglob("*.xml"))
          for fixture in fixtures:
              ElementTree.parse(fixture)
              print(f"Valid XML: {fixture}")
          print(f"Parsed {len(fixtures)} XML fixture(s)")
          PY
